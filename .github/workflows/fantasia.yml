name: FANTASIA
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verifica la connessione a Drive senza pubblicare
        type: boolean
        default: true
  schedule:
    - cron: '15 */6 * * *'

concurrency:
  group: fantasia-pages
  cancel-in-progress: false

jobs:
  verify-drive:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verifica le cartelle di FANTASIA
        env:
          FANTASIA_DRIVE_CREDENTIALS: ${{ secrets.FANTASIA_DRIVE_CREDENTIALS }}
          FANTASIA_NEW_ID: ${{ vars.FANTASIA_NEW_ID }}
          FANTASIA_OLD_ID: ${{ vars.FANTASIA_OLD_ID }}
          FANTASIA_SHARED_DRIVE_ID: ${{ vars.FANTASIA_SHARED_DRIVE_ID }}
        run: python main.py check-drive
  publish:
    if: ${{ github.event_name == 'schedule' || !inputs.verify_only }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    env:
      FANTASIA_NEW_ID: ${{ vars.FANTASIA_NEW_ID }}
      FANTASIA_OLD_ID: ${{ vars.FANTASIA_OLD_ID }}
      FANTASIA_SHARED_DRIVE_ID: ${{ vars.FANTASIA_SHARED_DRIVE_ID }}
      PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        if: vars.FANTASIA_PRODUCER == 'intersearQ'
        with:
          node-version: '22'
      - name: Accoda nuove segnalazioni intersearQ
        if: vars.FANTASIA_PRODUCER == 'intersearQ'
        continue-on-error: true
        env:
          FANTASIA_DRIVE_CREDENTIALS: ${{ secrets.FANTASIA_DRIVE_CREDENTIALS }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python producer.py
      - name: Prepara le card e archivia le espulsioni
        env:
          FANTASIA_DRIVE_CREDENTIALS: ${{ secrets.FANTASIA_DRIVE_CREDENTIALS }}
        run: python main.py prepare
      - name: Registra insieme lo stato e le pagine
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs state_12.json
          if ! git diff --cached --quiet; then
            git commit -m 'Aggiorna il feed FANTASIA'
            git push origin HEAD
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
          name: ${{ env.PAGES_ARTIFACT }}
      - name: Attendi la disponibilità del pacchetto Pages
        id: pages_artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            artifact_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f name="$PAGES_ARTIFACT" --jq '.artifacts[] | select(.expired == false) | .id') || artifact_id=''
            if [[ "$artifact_id" =~ ^[0-9]+$ ]]; then
              echo "id=$artifact_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo '::error::Il pacchetto Pages non risulta disponibile per questo tentativo.'
          exit 1
      - name: Pubblica il pacchetto Pages tramite ID
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.id }}
        run: python pages_deploy.py "$PAGES_ARTIFACT_ID"
      - name: Rimuovi dalla coda i sorgenti pubblicati
        env:
          FANTASIA_DRIVE_CREDENTIALS: ${{ secrets.FANTASIA_DRIVE_CREDENTIALS }}
        run: python main.py ack
